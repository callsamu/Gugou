[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["common", "fastapi>=0.115", "httpx>=0.27", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
common = { workspace = true }
