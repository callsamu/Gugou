name: gugou

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.56
    environment:
      MEILI_MASTER_KEY: SecretPassword
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: ["meilisearch-data:/meili_data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., args: { SERVICE: api } }
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment: &env
      REDIS_URL: redis://redis:6379/0
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: SecretPassword
      MEILISEARCH_INDEX: pages
      RAW_STORAGE_DIR: /app/data/raw
      DEBUG: ${DEBUG:-true}
      FRONTIER_URL: http://frontier:8001
    volumes: ["raw-data:/app/data/raw"]
    depends_on:
      redis: { condition: service_healthy }
      frontier: { condition: service_started }

  frontier:
    build: { context: ., args: { SERVICE: frontier } }
    command: uvicorn frontier.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    environment:
      <<: *env
      FRONTIER_DB_URL: sqlite:////app/data/frontier/frontier.db
    volumes: ["frontier-data:/app/data/frontier"]
    depends_on:
      redis: { condition: service_healthy }

  downloader:
    build: { context: ., args: { SERVICE: downloader } }
    command: celery -A downloader.main:app worker -Q download -l info
    environment: *env
    volumes: ["raw-data:/app/data/raw"]
    depends_on:
      redis: { condition: service_healthy }

  extractor:
    build: { context: ., args: { SERVICE: extractor } }
    command: celery -A extractor.main:app worker -Q extract -l info
    environment: *env
    volumes: ["raw-data:/app/data/raw"]
    depends_on:
      redis: { condition: service_healthy }
      frontier: { condition: service_started }

  searcher:
    build: { context: ., args: { SERVICE: searcher } }
    command: celery -A searcher.main:app worker -Q index,search -l info
    environment: *env
    depends_on:
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }

volumes:
  raw-data:
  meilisearch-data:
  frontier-data:
